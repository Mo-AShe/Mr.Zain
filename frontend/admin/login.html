<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login — MR. ZAIN</title>
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="stylesheet" href="/css/rtl.css" />
  </head>
  <body class="admin-login-body">
    <main class="admin-login-shell" id="admin-login-main">
      <section class="admin-login-card" aria-labelledby="admin-login-heading">
        <div class="admin-login-brand">
          <img src="/assets/images/mr-zain-logo.png" alt="MR. ZAIN" />
          <span>MR. ZAIN</span>
        </div>
        <h1 id="admin-login-heading" data-i18n="admin.loginTitle">Administrator Sign In</h1>
        <p class="admin-login-subtitle" data-i18n="admin.loginSubtitle">
          Sign in with an administrator account.
        </p>

        <div id="admin-login-status" class="form-status form-status--error" role="alert" hidden></div>

        <form id="admin-login-form" class="admin-login-form" novalidate>
          <div class="field">
            <label class="field__label" for="admin-login-email" data-i18n="admin.loginEmail">
              Email Address
            </label>
            <input
              id="admin-login-email"
              name="email"
              type="email"
              autocomplete="username"
              class="input"
              data-i18n-placeholder="admin.loginEmailPlaceholder"
              placeholder="admin@example.com"
              required
            />
            <span id="admin-login-email-error" class="form-error" aria-live="polite"></span>
          </div>

          <div class="field">
            <label class="field__label" for="admin-login-password" data-i18n="admin.loginPassword">
              Password
            </label>
            <input
              id="admin-login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              class="input"
              data-i18n-placeholder="admin.loginPasswordPlaceholder"
              placeholder="Enter your password"
              required
            />
            <span id="admin-login-password-error" class="form-error" aria-live="polite"></span>
          </div>

          <label class="admin-login-remember">
            <input id="admin-login-remember" name="rememberMe" type="checkbox" />
            <span data-i18n="admin.loginRemember">Keep me signed in for 30 days</span>
          </label>

          <button id="admin-login-submit" type="submit" class="btn btn--primary" data-i18n="admin.loginSubmit">
            Sign In
          </button>
        </form>

        <a href="/index.html" class="admin-login-store-link" data-i18n="admin.loginReturnStore">
          Return to Storefront
        </a>
        <button
          type="button"
          id="admin-login-lang"
          class="admin-lang-btn"
          data-i18n="nav.langSwitch"
          data-i18n-aria="nav.langSwitchAria"
        >
          العربية
        </button>
      </section>
    </main>
    <script type="module" src="/js/admin/login.js"></script>
  </body>
</html>
