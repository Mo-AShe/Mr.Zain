<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact — MR. ZAIN</title>
    <meta
      name="description"
      content="Contact MR. ZAIN customer care for order, sizing, and delivery support."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/storefront.css" />
    <link rel="stylesheet" href="./css/responsive.css" />
    <link rel="stylesheet" href="./css/rtl.css" />
  </head>
  <body>
    <div id="site-announcement"></div>
    <header id="site-header"></header>

    <main id="app-main">
      <section class="page-intro">
        <div class="container">
          <span class="section-kicker" data-i18n="contact.eyebrow">Client Care</span>
          <h1 class="page-intro__title" data-i18n="contact.title">Contact MR. ZAIN</h1>
          <p class="page-intro__subtitle" data-i18n="contact.subtitle">
            For help with your order, sizing, or delivery, reach our customer care team.
          </p>
        </div>
      </section>

      <section class="container contact-grid" aria-labelledby="contact-info-heading">
        <article class="contact-info-card">
          <h2 id="contact-info-heading" data-i18n="contact.infoHeading">Business Information</h2>
          <div class="contact-info-list">
            <div class="contact-info-item">
              <span class="contact-info-item__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M4 5h16v14H4z" />
                  <path d="m4 7 8 6 8-6" />
                </svg>
              </span>
              <div>
                <span class="contact-info-item__label" data-i18n="footer.emailLabel">Email</span>
                <a id="contact-email-val" href="mailto:care@mrzain.eg">care@mrzain.eg</a>
              </div>
            </div>

            <div class="contact-info-item" id="contact-whatsapp-item" hidden>
              <span class="contact-info-item__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M7 3h3l2 5-2.5 1.5a15 15 0 0 0 5 5L16 12l5 2v3c0 1.1-.9 2-2 2C10.7 19 5 13.3 5 5c0-1.1.9-2 2-2Z" />
                </svg>
              </span>
              <div>
                <span class="contact-info-item__label" data-i18n="footer.whatsappLabel">WhatsApp</span>
                <div id="contact-whatsapp-links" class="contact-whatsapp-links"></div>
              </div>
            </div>

            <div class="contact-info-item">
              <span class="contact-info-item__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                  <circle cx="12" cy="12" r="9" />
                  <path d="M12 7v5l3 2" />
                </svg>
              </span>
              <div>
                <span class="contact-info-item__label" data-i18n="footer.hoursLabel">Working Hours</span>
                <span id="contact-hours-val" data-i18n="footer.hoursValue">
                  Saturday to Thursday: 8:00 AM – 8:00 PM. Friday: Closed.
                </span>
              </div>
            </div>

            <div class="contact-info-item">
              <span class="contact-info-item__icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                  <path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z" />
                  <circle cx="12" cy="10" r="2.2" />
                </svg>
              </span>
              <div>
                <span class="contact-info-item__label" data-i18n="footer.locationLabel">Location</span>
                <span id="contact-location-val" data-i18n="footer.locationValue">Assiut, Egypt</span>
              </div>
            </div>
          </div>
        </article>
      </section>
    </main>

    <footer id="site-footer"></footer>
    <script type="module" src="./js/pages/contact.js"></script>
  </body>
</html>
