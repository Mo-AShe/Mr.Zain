<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop — MR. ZAIN</title>
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Shop MR. ZAIN heavyweight hoodies, sweatshirts, and winter outerwear across Egypt."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="/css/variables.css" />
    <link rel="stylesheet" href="/css/reset.css" />
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/storefront.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
    <link rel="stylesheet" href="/css/rtl.css" />
  </head>
  <body>
    <div id="site-announcement"></div>
    <header id="site-header"></header>

    <main id="app-main">
      <section class="page-intro">
        <div class="container">
          <span class="section-kicker" data-i18n="brand.tagline">Minimalist Egyptian Streetwear</span>
          <h1 class="page-intro__title" data-i18n="shop.title">Shop All Pieces</h1>
          <p class="page-intro__subtitle" data-i18n="shop.subtitle">
            Minimalist heavyweight hoodies, sweatshirts, and winter outerwear.
          </p>
        </div>
      </section>

      <div class="container shop-layout">
        <!-- Mobile Drawer Backdrop -->
        <div id="shop-filter-backdrop" class="mobile-drawer-backdrop"></div>

        <!-- Filter Sidebar / Mobile Drawer -->
        <aside id="shop-filter-sidebar" class="shop-sidebar" aria-label="Product Filters">
          <div class="shop-sidebar__head">
            <h2 style="font-size: 1rem;" data-i18n="shop.filtersHeading">Filter</h2>
            <div style="display: flex; align-items: center; gap: 0.5rem;">
              <button type="button" id="shop-clear-all" class="btn btn--ghost btn--sm" data-i18n="shop.clearFilters">
                Clear all
              </button>
              <button type="button" id="shop-drawer-close" class="header-icon-btn shop-drawer-close" data-i18n-aria="ui.close" aria-label="Close">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                  <path d="M18 6 6 18M6 6l12 12" />
                </svg>
              </button>
            </div>
          </div>

          <div class="filter-group">
            <span class="filter-group__title" data-i18n="shop.categoryLabel">Category</span>
            <div id="filter-categories" class="filter-option-list"></div>
          </div>

          <div class="filter-group">
            <span class="filter-group__title" data-i18n="shop.priceLabel">Price Range (EGP)</span>
            <div class="price-range-inputs">
              <label class="sr-only" for="filter-min-price" data-i18n="shop.minPrice">Min</label>
              <input id="filter-min-price" type="number" min="0" class="input" data-i18n-placeholder="shop.minPrice" placeholder="Min" />
              <label class="sr-only" for="filter-max-price" data-i18n="shop.maxPrice">Max</label>
              <input id="filter-max-price" type="number" min="0" class="input" data-i18n-placeholder="shop.maxPrice" placeholder="Max" />
            </div>
          </div>

          <div class="filter-group">
            <span class="filter-group__title" data-i18n="shop.sizeLabel">Size</span>
            <div id="filter-sizes" class="filter-size-grid"></div>
          </div>

          <div class="filter-group">
            <span class="filter-group__title" data-i18n="shop.colorLabel">Color</span>
            <div id="filter-colors" class="filter-color-list"></div>
          </div>

          <div class="filter-group">
            <span class="filter-group__title" data-i18n="shop.availabilityLabel">Availability</span>
            <label class="filter-checkbox">
              <input type="checkbox" id="filter-in-stock" />
              <span data-i18n="shop.inStockOnly">In stock only</span>
            </label>
          </div>

          <button type="button" id="shop-drawer-apply" class="btn btn--primary shop-drawer-close" data-i18n="shop.applyFilters">
            Apply filters
          </button>
        </aside>

        <!-- Product Listing Column -->
        <div>
          <div class="shop-toolbar">
            <form id="shop-search-form" class="shop-toolbar__search">
              <label for="shop-search-input" class="sr-only" data-i18n="shop.searchLabel">
                Search products
              </label>
              <input
                id="shop-search-input"
                type="search"
                class="input"
                data-i18n-placeholder="shop.searchPlaceholder"
                placeholder="Search by garment name or SKU..."
              />
              <button type="submit" class="btn btn--primary" data-i18n="search.submit">
                Search
              </button>
            </form>

            <div class="shop-toolbar__controls">
              <button type="button" id="shop-mobile-filter-btn" class="btn btn--secondary btn--sm shop-mobile-filter-trigger">
                <span data-i18n="shop.filtersBtn">Filters</span>
              </button>

              <span id="shop-result-count" class="text-muted tabular-nums" style="font-size: 0.875rem;"></span>

              <div style="display: flex; align-items: center; gap: 0.5rem;">
                <label for="shop-sort-select" class="text-muted" style="font-size: 0.75rem;" data-i18n="shop.sortLabel">
                  Sort by
                </label>
                <select id="shop-sort-select" class="input" style="min-height: 38px; width: auto;">
                  <option value="newest" data-i18n="shop.sortNewest">Newest</option>
                  <option value="price_asc" data-i18n="shop.sortPriceAsc">Price: Low to High</option>
                  <option value="price_desc" data-i18n="shop.sortPriceDesc">Price: High to Low</option>
                  <option value="popularity" data-i18n="shop.sortPopularity">Popularity</option>
                </select>
              </div>
            </div>
          </div>

          <div id="shop-active-filters" class="shop-active-bar" hidden></div>

          <div id="shop-product-grid" class="product-grid"></div>

          <div id="shop-pagination" class="shop-pagination" hidden>
            <span id="shop-showing-text" class="text-muted tabular-nums" style="font-size: 0.875rem;"></span>
            <button type="button" id="shop-load-more" class="btn btn--secondary" data-i18n="shop.loadMore">
              Load more pieces
            </button>
          </div>
        </div>
      </div>
    </main>

    <footer id="site-footer"></footer>

    <script type="module" src="/js/pages/shop.js"></script>
  </body>
</html>
